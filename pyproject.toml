
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblecast"
version = "0.1.0"
description = "Offline-first Bible presentation and sermon casting software"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
